<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#d4af37"/>
    </linearGradient>
  </defs>

  <!-- Circular border - gold arc (left) -->
  <path d="M 100 15 A 85 85 0 0 0 100 185"
        fill="none" stroke="#c9a227" stroke-width="4" stroke-linecap="round"/>

  <!-- Circular border - navy arc (right) -->
  <path d="M 100 185 A 85 85 0 0 0 100 15"
        fill="none" stroke="#1a2744" stroke-width="4" stroke-linecap="round"/>

  <!-- People icons -->
  <!-- Left person (gold) -->
  <circle cx="70" cy="52" r="8" fill="#c9a227"/>
  <path d="M 58 72 Q 58 62 70 62 Q 82 62 82 72" fill="#c9a227"/>

  <!-- Center person (navy, slightly higher) -->
  <circle cx="100" cy="48" r="9" fill="#1a2744"/>
  <path d="M 86 70 Q 86 58 100 58 Q 114 58 114 70" fill="#1a2744"/>

  <!-- Right person (navy) -->
  <circle cx="130" cy="52" r="8" fill="#1a2744"/>
  <path d="M 118 72 Q 118 62 130 62 Q 142 62 142 72" fill="#1a2744"/>

  <!-- Left receipt (gold outline) -->
  <g transform="translate(52, 78)">
    <path d="M 0 0 L 48 0 L 48 70 L 44 65 L 40 70 L 36 65 L 32 70 L 28 65 L 24 70 L 20 65 L 16 70 L 12 65 L 8 70 L 4 65 L 0 70 Z"
          fill="white" stroke="#c9a227" stroke-width="2.5"/>
    <!-- Lines on receipt -->
    <line x1="8" y1="12" x2="40" y2="12" stroke="#c9a227" stroke-width="2"/>
    <line x1="8" y1="22" x2="36" y2="22" stroke="#e0e0e0" stroke-width="1.5"/>
    <line x1="8" y1="30" x2="32" y2="30" stroke="#e0e0e0" stroke-width="1.5"/>
    <!-- Checkmark -->
    <path d="M 14 42 L 20 48 L 34 34" fill="none" stroke="#c9a227" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right receipt (navy outline, overlapping) -->
  <g transform="translate(88, 82)">
    <path d="M 0 0 L 52 0 L 52 74 L 47 69 L 42 74 L 37 69 L 32 74 L 27 69 L 22 74 L 17 69 L 12 74 L 7 69 L 2 74 L 0 72 Z"
          fill="white" stroke="#1a2744" stroke-width="2.5"/>
    <!-- Lines on receipt -->
    <line x1="8" y1="14" x2="44" y2="14" stroke="#1a2744" stroke-width="2"/>
    <line x1="8" y1="24" x2="40" y2="24" stroke="#e0e0e0" stroke-width="1.5"/>
    <line x1="8" y1="32" x2="36" y2="32" stroke="#e0e0e0" stroke-width="1.5"/>
    <line x1="8" y1="40" x2="30" y2="40" stroke="#e0e0e0" stroke-width="1.5"/>
    <!-- Checkmark -->
    <path d="M 16 52 L 22 58 L 38 42" fill="none" stroke="#1a2744" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>